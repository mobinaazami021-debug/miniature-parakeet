<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>آزمایشگاه هم‌نهشتی مثلث</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>آزمایشگاه هم‌نهشتی مثلث</h1>

<div class="buttons">
    <button onclick="setMode('move')">
        <img src="icons/move.png" class="icon"> انتقال
    </button>

    <button onclick="setMode('rotate')">
        <img src="icons/rotate.png" class="icon"> چرخش
    </button>

    <button onclick="setMode('reflect')">
        <img src="icons/reflect.png" class="icon"> بازتاب
    </button>

    <button onclick="setMode('scale')">
        <img src="icons/scale.png" class="icon"> تغییر اندازه
    </button>
</div>

<canvas id="cnv" width="500" height="400"></canvas>

<audio id="clickSound">
    <source src="click.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
