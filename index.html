<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>بررسی هم‌نهشتی مثلث‌ها</title>
<style>
    body {
        font-family: sans-serif;
        background: #f7f7f7;
        text-align: center;
        padding: 20px;
    }

    h2 {
        margin-top: 30px;
    }

    .container {
        display: flex;
        justify-content: center;
        gap: 40px;
        margin-top: 20px;
        flex-wrap: wrap;
    }

    canvas {
        width: 350px;
        height: 350px;
        border: 2px solid #444;
        cursor: crosshair;
        background-color: #ffffff;
        /* پس‌زمینهٔ شطرنجی */
        background-image:
            linear-gradient(90deg, rgba(0,0,0,0.1) 1px, transparent 1px),
            linear-gradient(rgba(0,0,0,0.1) 1px, transparent 1px);
        background-size: 25px 25px;
    }

    button {
        padding: 12px 25px;
        margin: 20px 10px;
        border: none;
        background: #ff7ab7;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-size: 17px;
    }

    button:hover {
        opacity: 0.85;
    }

    #result {
        margin-top: 25px;
        font-size: 20px;
        font-weight: bold;
    }
</style>
</head>
<body>

<h1>بررسی هم‌نهشتی مثلث‌ها</h1>
<p>روی هر بوم سه نقطه بزنید تا مثلث رسم شود.</p>

<div class="container">
    <div>
        <h2>مثلث اول</h2>
        <canvas id="canvas1"></canvas>
    </div>

    <div>
        <h2>مثلث دوم</h2>
        <canvas id="canvas2"></canvas>
    </div>
</div>

<button onclick="checkCongruence()">بررسی هم‌نهشتی</button>
<button onclick="resetAll()">پاک کردن هر دو مثلث</button>

<p id="result"></p>

<script>
    // متغیرها
    let canvas1 = document.getElementById("canvas1");
    let ctx1 = canvas1.getContext("2d");

    let canvas2 = document.getElementById("canvas2");
    let ctx2 = canvas2.getContext("2d");

    let points1 = [];
    let points2 = [];

    // ثبت نقاط
    canvas1.addEventListener("click", function(e) { addPoint(e, canvas1, ctx1, points1); });
    canvas2.addEventListener("click", function(e) { addPoint(e, canvas2, ctx2, points2); });

    function addPoint(e, canvas, ctx, list) {
        if (list.length >= 3) return;

        let rect = canvas.getBoundingClientRect();
        let x = e.clientX - rect.left;
        let y = e.clientY - rect.top;

        list.push({x, y});
        drawPoints(ctx, list);

        if (list.length === 3) drawTriangle(ctx, list);
    }

    function drawPoints(ctx, pts) {
        ctx.clearRect(0, 0, 350, 350);
        pts.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = "red";
            ctx.fill();
        });
    }

    function drawTriangle(ctx, pts) {
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        ctx.lineTo(pts[1].x, pts[1].y);
        ctx.lineTo(pts[2].x, pts[2].y);
        ctx.closePath();
        ctx.strokeStyle = "#000";
        ctx.stroke();
        ctx.fillStyle = "rgba(255,0,0,0.2)";
        ctx.fill();
    }

    // تابع فاصله
    function dist(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
    }

    // بررسی هم‌نهشتی (SSS)
    function checkCongruence() {
        if (points1.length < 3 || points2.length < 3) {
            document.getElementById("result").innerText = "هر دو مثلث باید کامل باشند!";
            return;
        }

        let s1 = [
            dist(points1[0], points1[1]),
            dist(points1[1], points1[2]),
            dist(points1[2], points1[0])
        ].sort((a,b) => a - b);

        let s2 = [
            dist(points2[0], points2[1]),
            dist(points2[1], points2[2]),
            dist(points2[2], points2[0])
        ].sort((a,b) => a - b);

        let ok = Math.abs(s1[0]-s2[0])<1 &&
                 Math.abs(s1[1]-s2[1])<1 &&
                 Math.abs(s1[2]-s2[2])<1;

        document.getElementById("result").innerText =
            ok ? "✔ مثلث‌ها هم‌نهشت هستند." : "✘ مثلث‌ها هم‌نهشت نیستند.";
    }

    // پاکسازی
    function resetAll() {
        points1 = [];
        points2 = [];
        ctx1.clearRect(0, 0, 350, 350);
        ctx2.clearRect(0, 0, 350, 350);
        document.getElementById("result").innerText = "";
    }
</script>

</body>
</html>
