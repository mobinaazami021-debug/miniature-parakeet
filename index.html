<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>آزمایشگاه هم‌نهشتی مثلث‌ها</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="header">
    ارائه‌دهنده: <b>مبینا اعظمی</b> – کلاس ۹/۲ – مدرسه پردیس 🎓✨
</div>

<div id="menu">
    <button onclick="setMode('edu')">📘 آموزش</button>
    <button onclick="setMode('build')">✏️ حالت ساخت</button>
    <button onclick="setMode('game')">🎮 حالت بازی</button>
    <button onclick="randomTriangle(1)">🔺 مثلث ۱ تصادفی</button>
    <button onclick="randomTriangle(2)">🔻 مثلث ۲ تصادفی</button>
    <button onclick="clearAll()">🧹 پاکسازی</button>
    <button onclick="showHelp()">❓ راهنما</button>
</div>

<div id="canvas-container">
    <canvas id="gridCanvas"></canvas>
</div>

<div id="infoBox">
    <h3>فرض:</h3>
    <textarea id="farz"></textarea>

    <h3>حکم:</h3>
    <textarea id="hokm"></textarea>

    <button id="checkBtn" onclick="checkCongruent()">🧠 بررسی هم‌نهشتی</button>
</div>

<script src="script.js"></script>
</body>
</html>
