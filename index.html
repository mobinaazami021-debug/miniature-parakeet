<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>آزمایشگاه معادلهٔ خط — پایه ۹</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Plotly (CDN) -->
  <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>

  <!-- MathJax -->
  <script>
    window.MathJax = { tex: {inlineMath: [['$','$'], ['\\(','\\)']]}, svg: {fontCache: 'global'} };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
</head>
<body dir="rtl">
  <header class="site-header">
    <div class="brand">
      <img src="assets/logo.svg" alt="لوگو" class="logo">
      <h1>آزمایشگاه معادلهٔ خط</h1>
      <p class="tagline">تمرین تعاملی روی $y=mx+b$ و فرم‌های مرتبط — مناسب پایهٔ نهم</p>
    </div>
  </header>

  <main class="container">
    <section class="controls card">
      <h2>ویرایشگر خط</h2>
      <div class="row">
        <label>شیب (m): <span id="mVal">1</span></label>
        <input id="mSlider" type="range" min="-5" max="5" step="0.1" value="1">
      </div>

      <div class="row">
        <label>عرض از مبدأ (b): <span id="bVal">0</span></label>
        <input id="bSlider" type="range" min="-10" max="10" step="0.5" value="0">
      </div>

      <div class="row">
        <button id="randomBtn" class="btn">سوال تصادفی</button>
        <button id="checkPointBtn" class="btn-outline">آزمون روی نقطه</button>
      </div>

      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>

    <section class="graph card" aria-label="نمودار خط">
      <h2>نمودار</h2>
      <div id="plot" style="width:100%;height:320px;"></div>
      <div class="legend">معادلهٔ کنونی: <code id="equation">y = 1x + 0</code></div>
    </section>

    <section class="exercise card">
      <h2>تمرین از کتاب</h2>
      <div id="exerciseText">برای شروع روی «سوال تصادفی» کلیک کنید.</div>
      <div class="exercise-actions">
        <input id="answerInput" placeholder="جواب را اینجا بنویسید (مثلاً y = 2x + 3)">
        <button id="submitAnswer" class="btn">ارسال پاسخ</button>
      </div>
    </section>

    <section class="progress card">
      <h2>پیشرفت شما</h2>
      <div>امتیاز فعلی: <span id="score">0</span></div>
      <button id="saveBtn" class="btn-outline">ذخیرهٔ محلی</button>
      <button id="loadBtn" class="btn-outline">بارگذاری</button>
    </section>
  </main>

  <footer class="site-footer">
    <small>ساخته‌شده برای معلمان و دانش‌آموزان — منطبق با کتاب ریاضی نهم</small>
  </footer>

  <!-- App JS -->
  <script src="js/app.js"></script>
</body>
</html>
