<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>آزمایشگاه هم‌نهشتی مثلث‌ها</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- آموزش اولیه -->
<div id="tutorialModal" class="modal">
    <div class="modal-content">
        <h2>آموزش کار با آزمایشگاه</h2>
        <p>در این آزمایشگاه می‌توانی نقطه‌های مثلث را روی صفحه بکشانی، اضلاع را تغییر دهی و بررسی کنی که آیا دو مثلث هم‌نهشت هستند یا خیر.</p>
        <p>برای شروع روی دکمه زیر کلیک کن:</p>
        <button id="startBtn">شروع</button>
    </div>
</div>

<header>
    <h1>آزمایشگاه فانتزی هم‌نهشتی مثلث‌ها</h1>
</header>

<section id="lab">
    <canvas id="triangleCanvas"></canvas>

    <div class="panel">
        <h3>تنظیمات مثلث‌ها</h3>

        <label>مثلث اول:</label>
        <button class="btn" onclick="randomTriangle(1)">مثلث تصادفی</button>

        <label>مثلث دوم:</label>
        <button class="btn" onclick="randomTriangle(2)">مثلث تصادفی</button>

        <button id="checkBtn" class="check-btn">بررسی هم‌نهشتی</button>

        <p id="result"></p>
    </div>
</section>

<!-- صدا -->
<audio id="magicSound" src="magic.mp3"></audio>

<script src="app.js"></script>
</body>
</html>
