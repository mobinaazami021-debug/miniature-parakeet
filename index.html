<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمایشگاه هم‌نهشتی</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
    <h1>🧪 آزمایشگاه هم‌نهشتی — نسخه بازی</h1>
    <p>تشخیص هم‌نهشتی + صفحه شطرنجی + حالت بازی</p>
</header>

<div class="container">

    <aside class="panel">
        <h2>راهنما و اثبات</h2>

        <p><strong>فرض:</strong> <span id="farz">—</span></p>
        <p><strong>حکم:</strong> <span id="hokm">—</span></p>

        <p><strong>اثبات:</strong></p>
        <div id="proofBox">—</div>

        <hr>
        <h3>امتیاز: <span id="score">0</span></h3>

        <button onclick="startChallenge()" class="btn start">🎮 شروع چالش</button>
    </aside>

    <main class="boards">

        <section>
            <h2>مثلث اول</h2>
            <canvas id="canvas1" width="350" height="350"></canvas>
            <button onclick="randomTriangle(1)" class="btn purple">مثلث اول تصادفی</button>
        </section>

        <section>
            <h2>مثلث دوم</h2>
            <canvas id="canvas2" width="350" height="350"></canvas>
            <button onclick="randomTriangle(2)" class="btn pink">مثلث دوم تصادفی</button>
        </section>

    </main>
</div>

<div class="actions">
    <button onclick="snapAll()" class="btn snap">Snap 🔧</button>
    <button onclick="checkCongruent()" class="btn check">بررسی هم‌نهشتی</button>
</div>

<script src="app.js"></script>
</body>
</html>
